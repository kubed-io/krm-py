name: 🧪 Test

# Lint and the test suite. The matrix is event-shaped:
#
#   pull_request     3.12 + 3.15 — the fast gate, at both ends of the range
#   push: main       3.12 → 3.15 — the compatibility sweep, once the change has
#                    landed and nobody is blocked on it
#   workflow_call    full matrix too — publish.yml runs this before it cuts a
#                    version, so a release never ships an interpreter it has not
#                    been tested on
#
# pyproject declares requires-python >=3.12. Each leg only uploads its JUnit
# XML; `Test results` publishes them as one report and is the required check,
# so moving the matrix never means editing the branch rules.

on:
  # No `paths` filter on pull_request, deliberately. `Test results` is the
  # REQUIRED status check, and a path-filtered required check never reports on a
  # PR that misses the filter — GitHub then waits for it forever and the PR can
  # never merge. The push filter below is fine: nothing gates on it.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
    - kubed/**
    - tests/**
    - examples/**
    - pyproject.toml
    - .github/workflows/test.yml
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      # On a main-branch sweep the useful answer is "which versions broke", not
      # "the first one to".
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12", "3.15"]') || fromJSON('["3.12", "3.13", "3.14", "3.15"]') }}
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools_scm needs history to resolve a version at install time.
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install
      run: pip install ".[test]"

    # The example tests run real `kustomize build`s with exec functions; without
    # kustomize they skip, and a skipped build test is a green PR that never
    # proved its kustomization works. Same version as the devcontainer stage.
    - name: Install Kustomize
      env:
        KUSTOMIZE_VERSION: v5.7.1
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP/bin" kustomize
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Lint
      run: ruff check .

    - name: Test
      run: pytest --junit-xml=dist/test-results.xml

    # Even when pytest fails: a failing leg is the one whose report matters.
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # Unique per leg: artifacts with the same name collide.
        name: test-results-${{ matrix.python-version }}
        path: dist/test-results.xml
        retention-days: 7
        if-no-files-found: error

  # Every leg's results as one report (a sticky PR comment and a check run that
  # annotates a failing test), and the one check to require. It runs whatever
  # the legs did, so a failing leg still publishes, then fails here.
  results:
    name: Test results
    needs: test
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:

    # No merge-multiple: every leg's file is test-results.xml, so merged they
    # would overwrite each other; each artifact lands in its own directory.
    - name: Download Every Leg's Results
      uses: actions/download-artifact@v8
      with:
        path: results
        pattern: test-results-*

    # An overwrite is silent: the report looks healthy and describes a smaller
    # run. One report per leg directory, without naming how many legs there are.
    - name: Every Leg Is Present
      run: |
        dirs=$(find results -mindepth 1 -maxdepth 1 -type d | wc -l)
        files=$(find results -name '*.xml' | wc -l)
        echo "legs: $dirs, reports: $files"
        [ "$dirs" -gt 0 ] || { echo "::error::no leg uploaded a report"; exit 1; }
        [ "$dirs" -eq "$files" ] || { echo "::error::$dirs legs, $files reports"; exit 1; }

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Unit test results
        files: results/**/*.xml
        comment_mode: always
        # The last step fails the job on a failing leg; a reporting hiccup
        # should not be a second red X for the same failure.
        action_fail: false

    - name: Every Leg Passed
      if: needs.test.result != 'success'
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "::error::the test matrix ended $RESULT"
        exit 1
