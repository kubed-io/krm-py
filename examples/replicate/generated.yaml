apiVersion: krm.kubed.io
kind: Replicate
metadata:
  name: domain-replicas
  namespace: mastery
  labels:
    stuff.junk/garbage: stinky
spec:
  items:
  - name: foo
    url: google.com
  - name: bar
    url: facebook.com
  template:
    apiVersion: v1
    kind: Service
    metadata:
      labels: 
        pizza.kind/stuffed: pineapple
    spec:
      type: ExternalName
  overrides:
  - patches:
    # valueFrom.path: a JMESPath read straight off the item (any type)
    - op: replace
      path: /metadata/name
      valueFrom:
        path: name
    - op: add
      path: /spec/externalName
      valueFrom:
        path: url
    - op: replace
      path: /metadata/labels/pizza.kind~1stuffed
      valueFrom:
        path: name
  