apiVersion: krm.kubed.io
kind: Replicate
metadata:
  name: spread-over-az
spec:
  # replicas: 5 
  items: # can also be an array of values or the word 'random'
  - region: us-west-1
  - region: us-east-2
  - region: eu-north-6
  target:
    name: foo-*
    kind: "(Pod|Deployment|Service)"
    matchLabels:
      multiplied: "true"
  overrides:
  - patches:
    # options: replace-at-index — splice the region into segment 1 of the name
    # (foo-myapp -> foo-<region>), the same splice the random transformer uses
    - op: replace
      path: /metadata/name
      valueFrom:
        path: /region
      options:
        delimiter: "-"
        index: 1
  - patches:
    - op: add
      path: /metadata/labels/az
      valueFrom:
        path: /region
  - target:
      name: foo-myapp-2-b
    patches:
    - op: add
      path: /metadata/labels/favorite
      value: "true"
    - op: remove
      path: "/metadata/labels/example"
    




  