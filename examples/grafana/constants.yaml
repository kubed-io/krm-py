# Variables as resources, pulled into the dashboard by a Target. A Target sorts its
# matches by name, so these are named in the order they should appear.
apiVersion: grafana.krm.kubed.io/v1alpha1
kind: ConstantVariable
metadata:
  name: krm-example-1-namespace
  labels:
    dashboard: krm-example
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  name: namespace
  query: observe
  hide: hideVariable
---
apiVersion: grafana.krm.kubed.io/v1alpha1
kind: ConstantVariable
metadata:
  name: krm-example-2-selector
  labels:
    dashboard: krm-example
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  name: k8s_selector
  query: app.kubernetes.io/part-of=observe
  hide: hideVariable
