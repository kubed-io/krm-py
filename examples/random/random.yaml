apiVersion: krm.kubed.io
kind: Random
metadata:
  name: job-name-from-image
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: kubectl-kubed
spec:
  type: string
  length: 8
  upper: false
  special: false
  keepers:
  # Explicit fieldPaths on the keeper — takes priority over any annotation.
  - kind: Deployment
    name: web
    fieldPaths:
    - /spec/template/spec/containers/0/image
  # No fieldPaths here — Random falls back to each matched resource's
  # `random.krm.kubed.io/keepers.fieldpaths` annotation. Components can opt
  # their own resources into the seed without ever touching this file.
  - kind: ConfigMap
    matchLabels:
      seeder: keep-me
  targets:
  - kind: Job
    name: web-migrate-.*
    fieldPath: /metadata/name
    options:
      delimiter: '-'
      index: 2
